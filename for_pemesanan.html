<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Pemesanan Barang</title>
</head>
<body>

    <h1>Form Pemesanan Barang</h1>

    <hr>

    <nav>
        <a href="#home">Home</a> |
        <a href="#generate">Generate Link</a> |
        <a href="#history">Transaction History</a> |
        <a href="#policy">Policy</a> |
        <a href="#logout">Logout</a>
    </nav>

    <hr>

    <h2>Data Barang</h2>

<form>
    <p>
        <label>Title Here:</label><br>
        <input type="text" name="title"
               value="MacBook Air E800">
    </p>

    <p>
        <label>Description:</label><br>
        <textarea name="description" rows="4" cols="30">Year: 2004
Model:
Condition: Mint</textarea>
    </p>

    <p>
        <label>Account Number:</label><br>
        <input type="text" name="account"
               value="123-456-789-0">
    </p>

    <p>
        <label>Bank:</label><br>
        <select name="bank">
            <option>HSBC</option>
            <option>BCA</option>
            <option>BRI</option>
            <option>BNI</option>
            <option>Mandiri</option>
        </select>
    </p>

    <p>
        <label>Account Holder:</label><br>
        <input type="text" name="holder"
               value="Name Here">
    </p>
</form>
